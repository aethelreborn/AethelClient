name: Build & Release

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build AethelClient
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build --no-daemon --stacktrace

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AethelClient-jars
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
            !build/libs/*-dev.jar
          if-no-files-found: error

      - name: Resolve version
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        id: version
        run: |
          VERSION=$(grep -oP "version\s*=\s*'[^']*'" build.gradle | head -n1 | sed -E "s/.*'([^']*)'.*/\1/")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "AethelClient version: $VERSION"

      - name: Publish to GitHub Releases
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          TAG="v${VERSION}"

          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "${{ github.sha }}" \
              --title "AethelClient ${VERSION}" \
              --notes "Automated build of AethelClient ${VERSION} from ${GITHUB_SHA::7}." \
              --latest
          fi

          # Replace existing assets so every push refreshes the release jars.
          for asset in $(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name'); do
            gh release delete-asset "$TAG" "$asset" --repo "$GITHUB_REPOSITORY" -y || true
          done

          gh release upload "$TAG" \
            $(ls build/libs/*.jar | grep -v -- '-sources.jar' | grep -v -- '-dev.jar') \
            --repo "$GITHUB_REPOSITORY" --clobber

          gh release edit "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "AethelClient ${VERSION}" \
            --notes "Automated build of AethelClient ${VERSION} from ${GITHUB_SHA::7}." \
            --latest
